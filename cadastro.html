<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SpotMusic/Cadastro</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <menu>
            <a href="index.html">Início</a></li>
            <a href="login.html">Login</a></li>
            <a href="#">Sobre</a></li>
            <a href="#">Contato</a></li>
            <a href="cadastro.html">Cadastro</a></li>
        </menu>
    </header>
    <main>
    <div class="container">
        <h2>Cadastro de Usuário</h2>
        <form id="cadastroForm">
            <div class="form-group">
                <label for="nome">Nome Completo:</label>
                <input type="text" id="nome" required>
            </div>
            
            <div class="form-group">
                <label for="cpf">CPF:</label>
                <input type="text" id="cpf" placeholder="000.000.000-00" required>
            </div>
            
            <div class="form-group">
                <label for="endereco">Endereço:</label>
                <input type="text" id="endereco" required>
            </div>
            
            <div class="form-group">
                <label for="email">E-mail:</label>
                <input type="email" id="email" required>
            </div>
            
            <div class="form-group">
                <label for="senha">Senha de Acesso:</label>
                <input type="password" id="senha" required>
            </div>
            
            <div class="button-group">
                <button type="submit">Salvar Dados</button>
                <button type="button" class="btn-voltar" onclick="window.location.href='index.html'">Voltar</button>
            </div>
        </form>
    </div>
    </main>
    <footer>
        <p>&copy; 2026 SpotMusic. Todos os direitos reservados.
            <time id="dataAtual"></time>
        </p> 
    </footer>
    <script src="script.js"></script>
</body>
</html>
